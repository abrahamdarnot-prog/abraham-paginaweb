<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: #A4BED9;
            color: #282828;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            text-align: center;
        }
        main {
            background-color: #282828;
            color: #A4BED9;
            text-align: center;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
        }
        img {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
        }
        button {
            cursor: pointer;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background-color: #A4BED9;
            margin: 0 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>
        <img src="imagem-blog.png" alt="Ilustração sobre tecnologia, conexões digitais, lâmpada de ideias e capelo de formatura, com o texto Blog Tech Educação.">
        
        <article>
            <h2>Meu primeiro post</h2>
            <p><strong>Por: Abraham Leiva</strong></p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
            <button>❤️ <span>0</span></button>
            <button>👍 <span>0</span></button>
        </article>
    </main>

    <script>
        // Seleciona todos os botões da página
        const botoes = document.querySelectorAll("button");

        // Percorre cada botão e adiciona o ouvinte de clique
        botoes.forEach(function(botao) {
            botao.addEventListener("click", function() {
                let contador = botao.querySelector("span");
                let curtidas = Number(contador.textContent);
                contador.textContent = curtidas + 1;
            });
        });
    </script>
</body>
</html>
