<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: #A4BED9;
            color: #282828;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;

        }

            border-radius: 5px;

    <main>
        <img src="imagem-blog.png" alt="Ilustração moderna sobre tecnologia e educação mostrando um livro onde saem conexões digitais, lâmpada de ideias e capelo de formatura, com o texto Blog Tech Educação.">
        
        <article>
            <h2>Meu primeiro post</h2>
            <p><strong>Por: Abraham Leiva</strong></p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
            <button>❤️ <span>0</span></button>
